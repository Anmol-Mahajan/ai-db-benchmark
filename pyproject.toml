[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-database-benchmark"
version = "0.1.0"
description = "Local-first AI database benchmark lab baseline for SQLite and DuckDB."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "duckdb>=1.0,<2.0",
  "psutil>=5.9,<8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9.0"
]
vector = [
  "chromadb>=0.5,<1.0",
  "lancedb>=0.14,<1.0",
  "pymilvus[milvus_lite]>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "qdrant-client>=1.9,<2.0",
  "setuptools>=68,<81"
]

[project.scripts]
ai-db-benchmark = "ai_db_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires external services such as Docker databases"
]
